# Copy to <your project>/codemind.toml (or put the same keys under [tool.codemind] in pyproject.toml).

exclude = ["tests/fixtures/", "migrations", "*_pb2.py"]   # globs; trailing "/" = directory
max_file_size_kb = 2048
# db_path = ".codemind/history.db"                        # default: $CODEMIND_DB or ~/.codemind/history.db

[thresholds]
max_function_lines = 50
max_complexity = 10          # CM202 (HIGH above high_complexity)
high_complexity = 20
max_nesting = 4
max_parameters = 6
max_class_lines = 300
max_class_methods = 20
max_module_coupling = 15     # in + out internal imports (CM302)
duplicate_min_statements = 4 # CM304 window size
duplicate_min_nodes = 30

[weights]                    # relative; normalised to 100 penalty points
findings = 35
complexity = 25
maintainability = 20
structure = 20
density_scale = 5.0          # weighted finding points per 100 LOC at which findings badness is ~63%

[rules]
disable = ["CM303"]

[rules.severity]
CM102 = "medium"
CM114 = "info"
